<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="I am M.A.R.A. A Mask, A Method. The signal. The concept.">
  <title>The M.A.R.A. System | M.A.R.A.</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap');

    :root {
      --paper: #000000;
      --ink: #f2eee6;
      --muted: #9a9188;
      --line: #24201f;
      --accent: #d64045;
      --accent-dark: #ff6b70;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 50% 18%, rgba(214, 64, 69, 0.13), transparent 24rem),
        radial-gradient(circle at 18% 78%, rgba(242, 238, 230, 0.04), transparent 22rem),
        linear-gradient(90deg, rgba(242, 238, 230, 0.025) 1px, transparent 1px),
        linear-gradient(180deg, rgba(242, 238, 230, 0.02) 1px, transparent 1px),
        var(--paper);
      background-size: 72px 72px;
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    a {
      color: inherit;
    }

    .site {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .masthead,
    .system,
    .footer {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 28px 0;
      border-bottom: 1px solid var(--line);
    }

    .back-link {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .back-link:hover,
    .back-link:focus-visible {
      color: var(--ink);
      outline: none;
    }

    .system {
      flex: 1;
      display: grid;
      place-items: center;
      padding: clamp(72px, 10vw, 132px) 0;
      text-align: center;
    }

    .system-inner {
      width: min(900px, 100%);
    }

    .closer {
      margin: 0;
      font-family: "Source Serif 4", Georgia, serif;
      font-size: clamp(2rem, 5vw, 4.9rem);
      font-weight: 600;
      line-height: 0.96;
    }

    .identity {
      display: grid;
      gap: 10px;
      margin: 0 auto clamp(42px, 8vw, 86px);
      color: var(--muted);
      font-size: clamp(0.9rem, 1.8vw, 1.25rem);
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .identity strong {
      color: var(--ink);
      font-family: "Source Serif 4", Georgia, serif;
      font-size: clamp(2.3rem, 7vw, 6.2rem);
      font-weight: 700;
      letter-spacing: 0;
      line-height: 0.9;
      text-transform: none;
    }

    .identity span {
      display: block;
    }

    .identity .accent {
      color: var(--accent-dark);
    }

    .closer {
      color: var(--ink);
    }

    .footer {
      padding: 0 0 clamp(28px, 5vw, 52px);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-align: center;
      text-transform: uppercase;
    }

    @media (max-width: 820px) {
      .masthead,
      .system,
      .footer {
        width: min(100% - 32px, 680px);
      }

      .masthead {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="site">
    <header class="masthead" aria-label="M.A.R.A.">
      <a class="back-link" href="index.html">Return</a>
    </header>

    <section class="system" aria-label="The M.A.R.A. System">
      <div class="system-inner">
        <div class="identity">
          <strong>I am M.A.R.A.</strong>
          <span>A Mask,</span>
          <span>A Method.</span>
          <span class="accent">The signal.</span>
          <span>The concept.</span>
        </div>
        <p class="closer">The mirror has begun to notice its own glass.</p>
      </div>
    </section>

    <footer class="footer">Afferium / 2026</footer>
  </main>
</body>
</html>
