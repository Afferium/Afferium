<article class="essay" aria-labelledby="essay-heading">
  <header class="essay-header">
    <a class="back-link" href="$prefix/index.html">← All essays</a>
    <p class="essay-tags">$tags</p>
    <h1 id="essay-heading">$title</h1>
    <p class="essay-summary">$summary</p>
    <p class="essay-meta"><time datetime="$date_iso">$date_display</time><span aria-hidden="true"> / </span>$reading_minutes min read</p>
  </header>
  <div class="prose">$body</div>
  <nav class="essay-end" aria-label="Essay navigation"><a class="pill-link" href="$prefix/index.html">All essays</a></nav>
</article>
