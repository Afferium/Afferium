<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="$description">
  <meta name="theme-color" content="#000000">
  $head_extra
  <title>$page_title</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Inter:wght@400;500;600&family=Roboto+Slab:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="$prefix/assets/blog.css">
</head>
<body class="$body_class">
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="site">
    <header class="masthead">
      <div class="wordmark">Where the afferent <span class="ending">ends<span class="endpoint" aria-hidden="true">.</span></span></div>
      <nav class="top-nav" aria-label="Site navigation">$navigation</nav>
    </header>
    $preview_notice
    <main id="content">$content</main>
    <footer class="footer"><a href="$main_url">Afferium</a><span aria-hidden="true"> / </span>$year</footer>
  </div>
</body>
</html>
