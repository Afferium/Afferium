<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="If you think I'm wrong, show me where. If you think I'm right, don't applaud me: improve the argument.">
  <title>Improve the Argument | M.A.R.A.</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap');

    :root {
      --paper: #000000;
      --ink: #f2eee6;
      --muted: #9a9188;
      --line: #24201f;
      --accent-dark: #ff6b70;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 12% 8%, rgba(214, 64, 69, 0.09), transparent 26rem),
        radial-gradient(circle at 80% 18%, rgba(242, 238, 230, 0.035), transparent 24rem),
        linear-gradient(90deg, rgba(242, 238, 230, 0.025) 1px, transparent 1px),
        linear-gradient(180deg, rgba(242, 238, 230, 0.02) 1px, transparent 1px),
        var(--paper);
      background-size: 72px 72px;
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    a {
      color: inherit;
    }

    .site {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .masthead,
    .statement,
    .footer {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 24px;
      padding: 28px 0;
      border-bottom: 1px solid var(--line);
    }

    .back-link {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .back-link:hover,
    .back-link:focus-visible {
      color: var(--ink);
      outline: none;
    }

    .statement {
      display: flex;
      flex-direction: column;
      flex: 1;
      align-items: center;
      justify-content: center;
      gap: clamp(28px, 5vw, 52px);
      padding: clamp(72px, 12vw, 150px) 0;
    }

    .statement p {
      max-width: 930px;
      margin: 0;
      color: var(--ink);
      font-family: "Source Serif 4", Georgia, serif;
      font-size: clamp(2.25rem, 6vw, 5.7rem);
      line-height: 0.98;
      text-align: center;
    }

    .statement span {
      color: var(--accent-dark);
    }

    .contact-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 18px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
      transition: background 180ms ease, color 180ms ease;
    }

    .contact-link:hover,
    .contact-link:focus-visible {
      background: var(--ink);
      color: var(--paper);
      outline: none;
    }

    .footer {
      padding: 0 0 clamp(28px, 5vw, 52px);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-align: center;
      text-transform: uppercase;
    }

    @media (max-width: 820px) {
      .masthead,
      .statement,
      .footer {
        width: min(100% - 32px, 680px);
      }

      .masthead {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="site">
    <header class="masthead" aria-label="M.A.R.A.">
      <a class="back-link" href="index.html">Return</a>
    </header>

    <section class="statement" aria-label="Improve the argument">
      <p>If you think I'm wrong, <span>show me where.</span> If you think I'm right, don't applaud me: <span>improve the argument.</span></p>
      <a class="contact-link" href="mailto:Afferium@gmail.com">Contact</a>
    </section>

    <footer class="footer">Afferium / 2026</footer>
  </main>
</body>
</html>
